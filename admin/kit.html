<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Kit — Malkah Admin</title>
  <meta name="robots" content="noindex,nofollow" />

  <link rel="icon" type="image/x-icon" href="/img/favicon/favicon.ico" />
  <link rel="stylesheet" href="/styles/style.css" />
</head>
<body>

  <site-nav></site-nav>

  <main style="margin-top: 68px;">
    <admin-layout data-page="kit"></admin-layout>
  </main>

  <site-footer></site-footer>

  <script src="/js/main.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    const kitId = getQueryParam('id')
    let kit = null
    let school = null

    customElements.whenDefined('admin-layout').then(() => {
      setTimeout(initKit, 50)
    })

    async function initKit() {
      const data = await dbSelect('kits', `select=*&id=eq.${kitId}&limit=1`)
      kit = data[0]
      if (!kit) {
        document.querySelector('#admin-content').innerHTML = '<p>Kit not found.</p>'
        return
      }
      const sData = await dbSelect('schools', `select=*&id=eq.${kit.school_id}&limit=1`)
      school = sData[0]
      document.title = `${kit.name} — Malkah Admin`

      const studentKitUrl = `/students/kit.html?school=${school.slug}&kit=${kit.slug}`

      const content = document.querySelector('#admin-content')
      content.innerHTML = `
        <div class="admin-section-header">
          <div>
            <p class="label">${school?.name || ''}</p>
            <h1 style="font-size: 2.2rem; font-weight: 700;">${kit.name}</h1>
            <p style="color: var(--muted); margin-top: 0.5rem;">${kit.description || ''}</p>
            <p style="color: var(--muted); margin-top: 0.5rem; font-size: 0.85rem;">
              💡 Drag videos by the handle to reorder them within a week.
            </p>
          </div>
          <div class="admin-header-actions">
            <a href="${studentKitUrl}" target="_blank" class="btn btn-teal">👁 View as Student</a>
            <button class="btn btn-primary" id="add-week-btn">+ Add Week</button>
          </div>
        </div>

        <div id="weeks-list" style="margin-top: 2rem;"></div>
        <p id="empty-msg" style="color: var(--muted); display: none;">No weeks yet.</p>
      `

      // Video modal
      const modalHtml = `
        <div class="modal" id="video-modal">
          <div class="modal-box">
            <h2 id="modal-title">Edit Video</h2>
            <form id="video-form">
              <input type="hidden" id="video-id" />
              <input type="hidden" id="video-week-id" />
              <input type="hidden" id="video-mode" />
              <div class="form-field">
                <label for="video-title">Video Title</label>
                <input type="text" id="video-title" required />
              </div>
              <div class="form-field">
                <label for="video-vimeo">Vimeo ID (just the number)</label>
                <input type="text" id="video-vimeo" />
              </div>
              <div class="form-field">
                <label for="video-desc">Description</label>
                <textarea id="video-desc" rows="3"></textarea>
              </div>
              <p id="video-err" style="color: #c0392b; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></p>
              <div class="modal-actions">
                <button type="button" class="btn btn-outline-dark" id="cancel-video-btn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
              </div>
            </form>
          </div>
        </div>
      `
      document.body.insertAdjacentHTML('beforeend', modalHtml)

      const modal = document.getElementById('video-modal')
      const openEditVideoModal = (video) => {
        document.getElementById('video-mode').value = 'edit'
        document.getElementById('video-id').value = video.id
        document.getElementById('video-week-id').value = ''
        document.getElementById('modal-title').textContent = `Edit: ${video.title}`
        document.getElementById('video-title').value = video.title
        document.getElementById('video-vimeo').value = video.vimeo_id || ''
        document.getElementById('video-desc').value = video.description || ''
        document.getElementById('video-err').style.display = 'none'
        modal.classList.add('open')
      }
      const openAddVideoModal = (weekId) => {
        document.getElementById('video-mode').value = 'add'
        document.getElementById('video-id').value = ''
        document.getElementById('video-week-id').value = weekId
        document.getElementById('modal-title').textContent = `Add Video`
        document.getElementById('video-title').value = ''
        document.getElementById('video-vimeo').value = ''
        document.getElementById('video-desc').value = ''
        document.getElementById('video-err').style.display = 'none'
        modal.classList.add('open')
      }
      const closeModal = () => modal.classList.remove('open')

      document.getElementById('cancel-video-btn').addEventListener('click', closeModal)
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal() })

      document.getElementById('video-form').addEventListener('submit', async (e) => {
        e.preventDefault()
        const mode = document.getElementById('video-mode').value
        const payload = {
          title: document.getElementById('video-title').value,
          vimeo_id: document.getElementById('video-vimeo').value || null,
          description: document.getElementById('video-desc').value,
        }
        try {
          if (mode === 'edit') {
            const id = document.getElementById('video-id').value
            await dbUpdate('videos', id, payload)
          } else {
            const weekId = parseInt(document.getElementById('video-week-id').value)
            const existing = await getVideosByWeek(weekId)
            const nextPos = existing.length === 0 ? 1 : Math.max(...existing.map(v => v.position)) + 1
            await dbInsert('videos', { ...payload, week_id: weekId, position: nextPos })
          }
          closeModal()
          loadWeeks()
        } catch (err) {
          const errEl = document.getElementById('video-err')
          errEl.textContent = String(err.message || err)
          errEl.style.display = 'block'
        }
      })

      document.getElementById('add-week-btn').addEventListener('click', async () => {
        const weeks = await getWeeksByKit(kitId)
        const nextNum = weeks.length === 0 ? 1 : Math.max(...weeks.map(w => w.number)) + 1
        const title = prompt(`Title for Week ${nextNum}?`, `Week ${nextNum}`)
        if (!title) return
        try {
          const w = await dbInsert('weeks', { kit_id: parseInt(kitId), number: nextNum, title })
          const weekId = w[0].id
          await dbInsert('videos', { week_id: weekId, position: 1, title: `${title} Video 1` })
          await dbInsert('videos', { week_id: weekId, position: 2, title: `${title} Video 2` })
          loadWeeks()
        } catch (err) {
          alert('Error: ' + err.message)
        }
      })

      // ── Reorder videos within a week ─────────────────────
      async function reorderVideos(weekId, newOrder) {
        for (let i = 0; i < newOrder.length; i++) {
          await dbUpdate('videos', newOrder[i], { position: -(i + 1) })
        }
        for (let i = 0; i < newOrder.length; i++) {
          await dbUpdate('videos', newOrder[i], { position: i + 1 })
        }
      }

      async function loadWeeks() {
        const list = document.getElementById('weeks-list')
        list.innerHTML = '<p style="color: var(--muted);">Loading...</p>'
        const weeks = await getWeeksByKit(kitId)
        if (weeks.length === 0) {
          list.innerHTML = ''
          document.getElementById('empty-msg').style.display = 'block'
          return
        }
        document.getElementById('empty-msg').style.display = 'none'
        list.innerHTML = ''

        const videosByWeek = {}
        await Promise.all(weeks.map(async w => {
          videosByWeek[w.id] = await getVideosByWeek(w.id)
        }))

        weeks.forEach(week => {
          const vids = videosByWeek[week.id] || []
          const studentWeekUrl = `/students/week.html?school=${school.slug}&kit=${kit.slug}&week=${week.number}`
          const wDiv = document.createElement('div')
          wDiv.className = 'admin-week-block'
          wDiv.innerHTML = `
            <div class="admin-week-head">
              <div class="admin-week-title-wrap">
                <span class="week-pill">Week ${week.number}</span>
                <span class="admin-week-title editable-title" data-week-id="${week.id}" title="Click to edit">${week.title}</span>
                <span class="edit-hint">✎</span>
              </div>
              <div class="admin-week-actions">
                <a href="${studentWeekUrl}" target="_blank" class="view-week-link" title="View this week as a student">👁 View</a>
                <button class="btn-icon delete-week-btn" data-id="${week.id}" title="Delete week">×</button>
              </div>
            </div>
            <div class="admin-videos" data-week-id="${week.id}">
              ${vids.map(v => `
                <div class="admin-video-row" draggable="true" data-video-id="${v.id}">
                  <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
                  <div class="admin-video-info">
                    <strong>${v.title}</strong>
                    ${v.vimeo_id ? `<span class="video-tag">Vimeo: ${v.vimeo_id}</span>` : '<span class="video-tag pending">No video yet</span>'}
                    ${v.description ? `<p>${v.description}</p>` : ''}
                  </div>
                  <div class="admin-video-actions">
                    <button class="btn btn-outline-dark edit-video-btn" data-id="${v.id}">Edit</button>
                    <button class="btn-icon delete-video-btn" data-id="${v.id}" data-title="${v.title.replace(/"/g, '&quot;')}" title="Delete video">×</button>
                  </div>
                </div>
              `).join('')}
              <div class="admin-add-video-row">
                <button class="btn btn-teal add-video-btn" data-week-id="${week.id}">+ Add Video</button>
              </div>
            </div>
          `

          const titleEl = wDiv.querySelector('.editable-title')
          titleEl.addEventListener('click', () => makeInlineEditable(titleEl, week))

          wDiv.querySelector('.delete-week-btn').addEventListener('click', async () => {
            if (confirm(`Delete Week ${week.number} (${week.title}) and its videos?`)) {
              await dbDelete('weeks', week.id)
              loadWeeks()
            }
          })

          wDiv.querySelectorAll('.edit-video-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const vid = vids.find(v => v.id == btn.dataset.id)
              openEditVideoModal(vid)
            })
          })

          wDiv.querySelectorAll('.delete-video-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              if (confirm(`Delete video "${btn.dataset.title}"?`)) {
                await dbDelete('videos', btn.dataset.id)
                loadWeeks()
              }
            })
          })

          wDiv.querySelector('.add-video-btn').addEventListener('click', () => {
            const btn = wDiv.querySelector('.add-video-btn')
            openAddVideoModal(parseInt(btn.dataset.weekId))
          })

          // Drag & drop reordering
          const videosContainer = wDiv.querySelector('.admin-videos')
          let draggedItem = null

          videosContainer.querySelectorAll('.admin-video-row').forEach(row => {
            row.addEventListener('dragstart', (e) => {
              draggedItem = row
              row.classList.add('dragging')
              e.dataTransfer.effectAllowed = 'move'
              e.dataTransfer.setData('text/html', row.outerHTML)
            })

            row.addEventListener('dragend', async () => {
              row.classList.remove('dragging')
              videosContainer.querySelectorAll('.admin-video-row').forEach(r => r.classList.remove('drag-over'))
              draggedItem = null
              const newOrder = [...videosContainer.querySelectorAll('.admin-video-row')]
                .map(r => parseInt(r.dataset.videoId))
              try {
                await reorderVideos(week.id, newOrder)
              } catch (err) {
                alert('Error saving order: ' + err.message)
                loadWeeks()
              }
            })

            row.addEventListener('dragover', (e) => {
              e.preventDefault()
              e.dataTransfer.dropEffect = 'move'
              if (draggedItem && draggedItem !== row) {
                row.classList.add('drag-over')
              }
            })

            row.addEventListener('dragleave', () => {
              row.classList.remove('drag-over')
            })

            row.addEventListener('drop', (e) => {
              e.preventDefault()
              row.classList.remove('drag-over')
              if (draggedItem && draggedItem !== row) {
                const rect = row.getBoundingClientRect()
                const midpoint = rect.top + rect.height / 2
                if (e.clientY < midpoint) {
                  row.parentNode.insertBefore(draggedItem, row)
                } else {
                  row.parentNode.insertBefore(draggedItem, row.nextSibling)
                }
              }
            })
          })

          list.appendChild(wDiv)
        })
      }

      function makeInlineEditable(titleEl, week) {
        if (titleEl.classList.contains('editing')) return
        const originalText = titleEl.textContent
        const input = document.createElement('input')
        input.type = 'text'
        input.value = originalText
        input.className = 'inline-edit-input'
        titleEl.classList.add('editing')
        titleEl.textContent = ''
        titleEl.appendChild(input)
        input.focus()
        input.select()

        const save = async () => {
          const newTitle = input.value.trim()
          if (!newTitle || newTitle === originalText) {
            titleEl.classList.remove('editing')
            titleEl.textContent = originalText
            return
          }
          try {
            await dbUpdate('weeks', week.id, { title: newTitle })
            titleEl.classList.remove('editing')
            titleEl.textContent = newTitle
          } catch (err) {
            alert('Error saving: ' + err.message)
            titleEl.classList.remove('editing')
            titleEl.textContent = originalText
          }
        }

        const cancel = () => {
          titleEl.classList.remove('editing')
          titleEl.textContent = originalText
        }

        input.addEventListener('blur', save)
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); input.blur() }
          else if (e.key === 'Escape') { input.removeEventListener('blur', save); cancel() }
        })
      }

      loadWeeks()
    }
  </script>
</body>
</html>
