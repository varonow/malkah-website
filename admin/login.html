<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Malkah</title>
  <meta name="robots" content="noindex,nofollow" />

  <link rel="icon" type="image/x-icon" href="/img/favicon/favicon.ico" />
  <link rel="stylesheet" href="/styles/style.css" />
</head>
<body>

  <site-nav></site-nav>

  <main style="margin-top: 68px;">
    <section class="section">
      <div class="container" style="max-width: 440px;">
        <p class="label">Admin</p>
        <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;">Sign in</h1>
        <p style="color: var(--muted); margin-bottom: 2rem;">Admin access only.</p>

        <div class="contact-form-box">
          <form id="login-form">
            <div class="form-field">
              <label for="email">Email</label>
              <input type="email" id="email" required />
            </div>
            <div class="form-field">
              <label for="password">Password</label>
              <input type="password" id="password" required />
            </div>
            <p id="error-msg" style="color: #c0392b; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></p>
            <button type="submit" class="btn btn-primary" id="submit-btn">Sign in</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="/js/main.js"></script>
  <script src="/js/supabase.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = 'dashboard.html'

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('submit-btn')
      const errMsg = document.getElementById('error-msg')
      errMsg.style.display = 'none'
      btn.textContent = 'Signing in...'
      btn.disabled = true

      const result = await login(
        document.getElementById('email').value,
        document.getElementById('password').value
      )

      if (result.ok) {
        window.location.href = 'dashboard.html'
      } else {
        errMsg.textContent = result.error
        errMsg.style.display = 'block'
        btn.textContent = 'Sign in'
        btn.disabled = false
      }
    })
  </script>
</body>
</html>
